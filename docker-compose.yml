version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_PASSWORD: password    # <-- ÄNDRAT HÄR från "postgres" till "password"
      POSTGRES_DB: tododb
    ports:
      - "5433:5432"
    networks:
      - todo-net

  backend:
    build: ./backend
    container_name: todo-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tododb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - todo-net

networks:
  todo-net: